<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Game</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script> 
</head>
<body>
<h2 id="username"></h2>

<div id="game">
    <div class="game_play">
        <h3>User <span id="userWin">0</span></h3>
        <div id="userScd" class="circle">0</div>
    </div>

    <div class="game_play">
        <h3>Computer <span id="comuterWin">0</span></h3>
        <div id="comuterScd" class="circle">0</div>
    </div>
</div>
<button id="random_number">START</button>
</body>
</html>
